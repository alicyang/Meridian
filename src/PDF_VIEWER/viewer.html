<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meridian PDF Viewer</title>

  <link rel="stylesheet" href="./pdf_viewer.css">
  <link rel="stylesheet" href="../content.css">

  <style>
    html, body {
      margin: 0;
      background: #f5f5f5;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100%;
      align-items: center;
    }

    h2 {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #toolbar {
      display: flex;
      justify-content: space-between;
      width: 90%;
      margin-bottom: 10px;
    }

    button {
      padding: 6px 12px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background: #0078ff;
      color: white;
      cursor: pointer;
    }

    #pdf-container {
      width: 100%;
      height: calc(100vh - 100px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f0f0f0;
      overflow: auto;
    }

    #page-container {
      position: relative;
      display: inline-block;
      background: white;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }

    #pdf-canvas {
      display: block;
      background: white;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .textLayer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: auto; /* allows selection */
      user-select: text; /* make spans selectable */
      background: transparent;
    }

    .textLayer > span {
      position: absolute;
      transform-origin: 0% 0%;
      white-space: pre;
      line-height: 1;
      cursor: text;
      color: transparent; /* invisible but selectable text */
      mix-blend-mode: multiply;
    }
  </style>
</head>

<body>
  <h2>Meridian PDF Viewer</h2>

  <div id="toolbar">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
    <span id="page-info"></span>
  </div>

  <div id="pdf-container">
    <div id="page-container">
      <canvas id="pdf-canvas"></canvas>
      <div id="text-layer" class="textLayer"></div>
    </div>
  </div>

  <script src="../utils/tooltip.js"></script>
  <script type="module" src="./viewer-init.js"></script>
</body>
</html>
