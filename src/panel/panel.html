<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian</title>
    <link rel="stylesheet" href="panel.css">
</head>

<body>
    <div id="extension-panel">
        <div>
            <h1>Meridian</h1>
            <p>Explore the Internet with the help of AI</p>
        </div>
        <!-- smart search ui -->
        <h1>Smart Search</h1>
        <div id="smart-search">
            <!-- chat container -->
            <div id="chat-container">
                <div id="chat-messages"></div>
                <div class="loader-container" id="assistant-loader-container">
                    <div class="loader" id="assistant-loader"></div>
                </div>
            </div>
            <!-- input area -->
            <div id="chat-input-area">
                <textarea id='user-input' placeholder="Ask anything about this page"></textarea>
                <button id="submit-btn" type="submit"></button>
            </div>
        </div>

        <!-- displayed on pages that are not accessible -->
        <div id="not-available">
            <p>Smart Search is not available on this page</p>
        </div>

        <!-- explain in context settings -->
        <button id="explainSelected">Explain Selected Text</button>
        <div id="aiStatus" style="margin-top: 10px; font-size: 12px; text-align: center; color: #666;"></div>
        <small>Select text on any site and right-click to explain it!</small>
        
        <br></br>
        
        <label>
            <input type="checkbox" id="analyzePDFs" checked>
            Read PDFs in extension viewer
        </label>
    </div>
    <script type="module" src="panel.js"></script>
</body>

</html>
