<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Meridian PDF Viewer</title>

  <!-- PDF.js built-in viewer styles (enables selectable text layout) -->
  <link rel="stylesheet" href="./pdf_viewer.css">
  <!-- PDF tooltips look like webpage tooltips -->
  <link rel="stylesheet" href="../utils/tooltip.css">

  <style>
    html,
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100%;
      align-items: center;
    }

    #pdf-container {
      width: 100%;
      height: calc(100vh - 80px);
      max-width: none;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
      background: white;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }

    #toolbar {
      display: flex;
      justify-content: space-between;
      width: 90%;
      margin-top: 10px;
    }

    #page-container {
      position: relative;
      width: min(100%, 1100px);
      /* Fill parent width */
      height: auto;
      display: block;
      overflow: auto;
    }

    #pdf-canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      padding: 6px 12px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background: #0078ff;
      color: white;
      cursor: pointer;
    }

    .textLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10 !important;
      /* ensures layer is above canvas */
      pointer-events: auto;
      /* makes sure clicks go through */

      /* for aesthetic */
      background-color: rgba(35, 160, 227, 0.05);
    }
  </style>
</head>

<body>
  <h2>Meridian PDF Viewer</h2>
  <div id="toolbar">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
    <span id="page-info"></span>
  </div>
  <!-- adding text layer -->
  <div id="pdf-container">
    <div id="page-container" style="position: relative;" class="pdfViewer">
      <canvas id="pdf-canvas"></canvas>
      <div id="text-layer" class="textLayer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
      </div>
    </div>
  </div>

  <!-- PDF.js library -->
  <script src="../utils/tooltip.js"></script>
  <script type="module" src="./viewer.js"></script>
</body>
</body>

</html>
