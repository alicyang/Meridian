<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Settings</title>
  <style>
    /* --- Earthy Color Palette --- */
    :root {
      --brown: #5c4033;
      --ocean: #2f3cb5a5;
      --cream: #f8f5ee;
      --olive: #6b705c;
      --clay: #a27b5c;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: system-ui, sans-serif;
      color: var(--cream);
      background: var(--ocean);
      padding: 20px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--clay);
      background: rgba(255, 255, 255, 0.1);
      color: var(--cream);
      margin-bottom: 16px;
      font-size: 14px;
    }

    select option {
      background: var(--brown);
      color: var(--cream);
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--olive);
      color: var(--cream);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: var(--clay);
    }

    small {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <h1>Meridian</h1>
  <p>Explore the Internet with the help of AI</p>

  <label for="targetLanguage">Select Language</label>
  <select id="targetLanguage">
    <option value="en">English (Default)</option>
    <option value="es">Spanish</option>
    <option value="ja">Japanese</option>
  </select>

  <button id="explainSelected">Explain Selected Text</button>
  <div id="aiStatus" style="margin-top: 10px; font-size: 12px; text-align: center; color: #666;"></div>
  <small>Select text on any site and right-click to explain it!</small>

  <br></br>
  
  <label>
    <input type="checkbox" id="analyzePDFs" checked>
    Read PDFs in extension viewer
  </label>

  <script src="popup.js"></script>
</body>
</html>
